# @package _global_
defaults:
  - /dataset: squad_dev_1k
  - /chunking: sliding_512_64
  - /generator: gpt4o_mini
  - /embedder: bge_small
  - /indexer: faiss_flat_triplets
  - /retriever: triplet_top_2
  - /student: gpt4o_mini
  - /inference_strategy: triplet
  - /metrics: lexical_only
  - _self_

experiment_name: squad_triplet_pilot
seed: 42

budget:
  total_context_items: 10
  num_triplets: 2
  per_triplet_contexts: 5
  matching_mode: item

preprocessing:
  num_questions_per_chunk: 5
  question_prompt: complex
  answer_prompt: rag_default
  max_questions_total: null
  dedupe_questions: true
  dedupe_threshold: 0.95

filtering:
  enabled: false
  faithfulness_threshold: 0.7
  judge_model: null

notes: "1k-query SQuAD pilot of triplet_rag at matched 10-context budget (2 triplets x 5 ctx)"

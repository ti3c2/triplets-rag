# @package _global_
defaults:
  - /dataset: squad_dev_1k
  - /chunking: whole_doc_8192
  - /generator: qwen_2_5_7b_local
  - /embedder: jina_v3_local
  - /indexer: faiss_flat_quote
  - /retriever: dense_top_k
  - /student: qwen_2_5_7b_local
  - /inference_strategy: vanilla
  - /metrics: lexical_only
  - _self_

experiment_name: squad_qwen7b_quote
seed: 42

budget:
  total_context_items: 10
  num_triplets: 2
  per_triplet_contexts: 5
  matching_mode: item

preprocessing:
  num_questions_per_chunk: 5
  question_prompt: complex
  answer_prompt: rag_default
  max_questions_total: null
  dedupe_questions: true
  dedupe_threshold: 0.95

filtering:
  enabled: false

notes: "SQuAD-1k, Qwen2.5-7B (local vLLM), jina-embeddings-v3 (local), whole-doc chunks (8192), QuOTE-style index (chunks_and_questions) + vanilla inference"

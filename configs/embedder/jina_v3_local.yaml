# @package embedder
# OpenAI-compatible embeddings server (e.g. TEI / infinity / jina) you
# already have running locally. URL may be set with embedder.base_url or
# EMBEDDER_BASE_URL in .env.
kind: openai_compatible
model_name: jinaai/jina-embeddings-v3
base_url: null
batch_size: 64
normalize: true
dim: 1024

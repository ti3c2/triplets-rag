[project]
name = "triplet-rag"
version = "0.1.0"
description = "Research codebase for triplet-based retrieval-augmented generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    # Data
    "pandas>=2.2",
    "pyarrow>=15.0",
    "datasets>=2.18",
    "numpy>=1.26",
    # Models / inference
    "litellm>=1.40",
    "openai>=1.30",
    "anthropic>=0.30",
    "tenacity>=8.2",
    # Embeddings & retrieval
    "sentence-transformers>=2.7",
    "faiss-cpu>=1.8",
    "torch>=2.2",
    # Evaluation
    "ir-measures>=0.3.3",
    "ragas>=0.1.10",
    "evaluate>=0.4",
    "rouge-score>=0.1.2",
    "nltk>=3.8",
    "rapidfuzz>=3.9",
    "sacrebleu>=2.4",
    "scipy>=1.12",
    # Templating
    "jinja2>=3.1",
    # Utilities
    "tqdm>=4.66",
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "psutil>=5.9",
]

[project.optional-dependencies]
# Optional local-vLLM extra. faiss-gpu was dropped — the upstream PyPI package
# was abandoned at 1.7.2 and `faiss-gpu>=1.8` doesn't exist; faiss-cpu (in base
# deps) is more than enough at this scale. vLLM is Linux-only, hence the marker.
gpu = [
    "vllm>=0.5.0 ; sys_platform == 'linux'",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
]

[project.scripts]
triplet-rag = "triplet_rag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triplet_rag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
